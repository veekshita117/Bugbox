name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore Bugbox.sln

      - name: Build Solution
        run: dotnet build Bugbox.sln --no-restore --configuration Release

      - name: Run Tests with Code Coverage
        run: dotnet test tests/Bugbox.Tests/Bugbox.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/tests/Bugbox.Tests/TestResults/**/coverage.cobertura.xml

  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build
