name: Deploy Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Run CI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Backend Tests
        run: |
          cd backend
          dotnet test Bugbox.sln --configuration Release

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend Tests & Build
        run: |
          cd frontend
          npm install
          npm test
          npm run build

  deploy-database:
    name: Apply Database Migrations
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Run Migrations against Azure SQL
        run: |
          cd backend
          dotnet ef database update --project src/Bugbox.Infrastructure --startup-project src/Bugbox.Api --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

  deploy-api:
    name: Deploy API to Azure App Service
    needs: deploy-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: |
          cd backend
          dotnet publish src/Bugbox.Api/Bugbox.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend/publish

  deploy-frontend:
    name: Deploy to Azure Static Web Apps
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/frontend'
          output_location: 'dist'
          app_build_command: 'npm run build'
